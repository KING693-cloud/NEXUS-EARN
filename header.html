        body:not(.loaded) .header-preview-placeholder {

    <!-- ============================================================
         PREVIEW MESSAGE – only shown when header.html is opened directly

        </p>
        <div class="badge"><i class="fa-regular fa-circle-check"></i> Ready for production</div>
    </div>

    <!-- ============================================================
         SCRIPT TO REMOVE THE PLACEHOLDER WHEN INCLUDED IN ANOTHER PAGE
         ============================================================ -->
    <script>
        // If this file is included inside another document, the placeholder
        // will be hidden because the body will not have the class 'loaded'
        // – we add 'loaded' to show that we are in a proper page context.
        (function() {
            // Check if we are inside a full page (not an iframe or standalone)
            if (window.parent === window) {
                // Only if the document has no other content (standalone)
                if (document.body.children.length === 1) {
                    document.body.classList.add('loaded');
                } else {
                    // We are included – hide the placeholder
                    const placeholder = document.querySelector('.header-preview-placeholder');
                    if (placeholder) placeholder.style.display = 'none';
                }
            }
        })();
    </script>
</body>
